name = "test-meta-new"
application_url = "https://jade-navigation-presence-cold.trycloudflare.com"
embedded = true
handle = "test-meta-new"

[webhooks]
api_version = "2024-07"

[[webhooks.subscriptions]]
topics = [
  "bulk_operations/finish",
  "app/uninstalled",
  "products/create",
  "products/update",
  "products/delete"
]
