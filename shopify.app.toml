  "https://jade-navigation-presence-cold.trycloudflare.com/auth/callback",
  "https://jade-navigation-presence-cold.trycloudflare.com/auth/shopify/callback",
  "https://jade-navigation-presence-cold.trycloudflare.com/auth/callback"
]

[app_proxy]
