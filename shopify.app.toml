client_id = "8080a194096cb602f516d4bb1841df93"
name = "test-meta-new"
application_url = "https://gtk-language-the-scanner.trycloudflare.com"
embedded = true
handle = "test-meta-new"

[webhooks]
api_version = "2024-07"

  [[webhooks.subscriptions]]
  topics = [
  "products/delete",
  "products/update",
  "bulk_operations/finish",
  "products/create",
  "app/uninstalled"
]
  uri = "/api/webhooks"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_inventory,read_locations,read_metaobjects,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://gtk-language-the-scanner.trycloudflare.com/auth/callback",
  "https://gtk-language-the-scanner.trycloudflare.com/auth/shopify/callback"
]

[app_proxy]
url = "https://automatic-learners-excluded-decorative.trycloudflare.com/storefront/subscription"
subpath = "proxy"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
